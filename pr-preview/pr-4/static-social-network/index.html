<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parasocial Network</title>
    <meta
      name="description"
      content="Parasocial Network: a tiny, no-login ‘social network’ demo with static placeholder text posts."
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: Canvas;
        --fg: CanvasText;
        --muted: color-mix(in oklab, CanvasText 65%, Canvas 35%);
        --card: color-mix(in oklab, Canvas 92%, CanvasText 8%);
        --border: color-mix(in oklab, CanvasText 18%, Canvas 82%);
        --accent: Highlight;
        --accentText: HighlightText;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans,
          Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      }

      a {
        color: inherit;
        text-decoration-color: color-mix(in oklab, currentColor 45%, transparent);
        text-underline-offset: 0.15em;
      }
      a:hover {
        text-decoration-color: currentColor;
      }

      header,
      main,
      footer {
        max-width: 1100px;
        margin: 0 auto;
        padding: clamp(12px, 3vw, 18px);
      }

      header {
        padding-top: clamp(14px, 4vw, 22px);
        padding-bottom: clamp(10px, 2vw, 14px);
      }

      h1 {
        font-size: 1.6rem;
        margin: 0 0 6px 0;
        letter-spacing: -0.01em;
      }

      .lede {
        margin: 0;
        color: var(--muted);
      }

      .setup {
        margin-top: 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
        box-shadow: var(--shadow);
        padding: 12px;
        display: grid;
        gap: 10px;
      }

      .setup-grid {
        display: grid;
        gap: 10px;
      }

      @media (min-width: 920px) {
        .setup-grid {
          grid-template-columns: 1fr 1.2fr;
          align-items: start;
        }
      }

      label {
        display: grid;
        gap: 6px;
        font-weight: 650;
      }

      .hint {
        font-weight: 500;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.35;
      }

      input[type="text"],
      input[type="password"],
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: Canvas;
        color: CanvasText;
        padding: 10px 12px;
        font: inherit;
      }

      textarea {
        resize: vertical;
        min-height: 88px;
      }

      .setup-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }

      .setup-status {
        color: var(--muted);
        font-size: 0.92rem;
      }

      .nav {
        position: sticky;
        top: 0;
        z-index: 10;
        background: color-mix(in oklab, var(--bg) 92%, transparent);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
      }

      .nav-inner {
        max-width: 1100px;
        margin: 0 auto;
        padding: 10px clamp(12px, 3vw, 18px);
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }

      .tabs {
        display: inline-flex;
        gap: 8px;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: color-mix(in oklab, Canvas 92%, CanvasText 8%);
        box-shadow: var(--shadow);
      }

      .tab {
        appearance: none;
        border: 0;
        background: transparent;
        color: inherit;
        border-radius: 999px;
        min-height: 40px;
        padding: 8px 12px;
        cursor: pointer;
        font-weight: 650;
      }

      .tab[aria-selected="true"] {
        background: var(--accent);
        color: var(--accentText);
      }

      .nav-meta {
        color: var(--muted);
        font-size: 0.92rem;
      }

      .hidden {
        display: none !important;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      @media (min-width: 560px) {
        .grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (min-width: 980px) {
        .grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      .photo-card {
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        background: var(--card);
        box-shadow: var(--shadow);
        cursor: pointer;
        padding: 0;
        text-align: left;
      }

      .thumb {
        width: 100%;
        aspect-ratio: 1 / 1;
        background: color-mix(in oklab, CanvasText 12%, Canvas 88%);
        display: block;
        border: 0;
      }

      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .card-meta {
        padding: 10px 10px 12px 10px;
        display: grid;
        gap: 6px;
      }

      .who {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .avatar {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: color-mix(in oklab, CanvasText 12%, Canvas 88%);
        overflow: hidden;
        flex: none;
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .name {
        font-weight: 700;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .handle {
        color: var(--muted);
        font-size: 0.92rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .handle .pill {
        margin-left: 8px;
      }

      .caption {
        margin: 0;
        color: color-mix(in oklab, CanvasText 84%, Canvas 16%);
        font-size: 0.95rem;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .feed {
        display: grid;
        gap: 14px;
      }

      .post {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .post-head {
        padding: 12px 12px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .post-head .who {
        gap: 10px;
      }

      .timestamp {
        color: var(--muted);
        font-size: 0.9rem;
        white-space: nowrap;
      }

      .video-wrap {
        width: 100%;
        background: color-mix(in oklab, CanvasText 10%, Canvas 90%);
      }

      .video-wrap video {
        width: 100%;
        display: block;
        max-height: min(72vh, 720px);
        object-fit: cover;
        background: #000;
      }

      .post-body {
        padding: 10px 12px 12px;
        display: grid;
        gap: 10px;
      }

      .post-body p {
        margin: 0;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 0.82rem;
        color: color-mix(in oklab, CanvasText 80%, Canvas 20%);
        background: color-mix(in oklab, Canvas 92%, CanvasText 8%);
      }

      dialog {
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 0;
        max-width: min(920px, calc(100vw - 24px));
        box-shadow: 0 14px 55px rgba(0, 0, 0, 0.25);
        background: var(--card);
        color: var(--fg);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.45);
      }

      .dialog-grid {
        display: grid;
        grid-template-columns: 1fr;
      }

      @media (min-width: 900px) {
        .dialog-grid {
          grid-template-columns: 1.2fr 0.8fr;
        }
      }

      .dialog-media {
        background: #000;
        min-height: 240px;
      }
      .dialog-media img {
        width: 100%;
        height: 100%;
        max-height: 80vh;
        object-fit: contain;
        display: block;
      }

      .dialog-meta {
        padding: 14px;
        border-top: 1px solid var(--border);
      }
      @media (min-width: 900px) {
        .dialog-meta {
          border-top: 0;
          border-left: 1px solid var(--border);
        }
      }

      .dialog-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: flex-end;
        padding: 12px 14px 14px;
        border-top: 1px solid var(--border);
      }

      button.btn {
        appearance: none;
        border: 1px solid var(--border);
        background: Canvas;
        color: CanvasText;
        border-radius: 999px;
        min-height: 44px;
        padding: 10px 14px;
        cursor: pointer;
        font-size: 16px;
      }

      button.btn.primary {
        border-color: color-mix(in oklab, var(--accent) 70%, var(--border));
        background: var(--accent);
        color: var(--accentText);
        font-weight: 650;
      }

      footer {
        padding-top: 10px;
        padding-bottom: 24px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Parasocial Network</h1>
      <p class="lede">
        A “social” network with <strong>no login</strong>. The other users’ posts are <strong>static placeholder content</strong>.
        For now, it’s all text posts.
      </p>

      <form class="setup" id="setupForm">
        <div class="setup-grid">
          <label>
            TMDB API key
            <input
              id="tmdbKey"
              type="password"
              inputmode="text"
              autocomplete="off"
              placeholder="Paste your TMDB v3 API key"
            />
            <span class="hint">Used only to look up account names via TMDB’s Person search API. Saved locally in this browser.</span>
          </label>

          <label>
            Account names (one per line)
            <textarea id="accountNames" placeholder="e.g.\nTom Hanks\nZendaya\nKeanu Reeves"></textarea>
            <span class="hint">
              We’ll search TMDB for each name and pick the result with the highest popularity. If no results, the name still
              appears but is marked “no personality.”
            </span>
          </label>
        </div>

        <div class="setup-actions">
          <button class="btn primary" type="submit" id="loadBtn">Load accounts</button>
          <div class="setup-status" id="setupStatus" role="status" aria-live="polite"></div>
        </div>
      </form>

      <p class="lede" style="margin-top: 10px">
        <span class="pill" id="counts"></span>
      </p>
    </header>

    <noscript>
      <main style="max-width: 1100px; margin: 0 auto; padding: 18px">
        <div style="border: 1px solid var(--border); border-radius: 14px; padding: 14px; background: var(--card)">
          <strong>JavaScript required</strong>
          <p class="lede" style="margin: 6px 0 0 0">
            This tool uses JavaScript to render placeholder text posts.
          </p>
        </div>
      </main>
    </noscript>

    <main>
      <div class="feed" id="textFeed" aria-label="Text posts feed"></div>
    </main>

    <footer>
      <p style="margin: 0">
        Built as a single-file HTML tool. No accounts, no server, no tracking: it’s just static placeholder posts and a bit of UI.
      </p>
    </footer>

    <script type="module">
      const el = {
        setupForm: /** @type {HTMLFormElement} */ (document.getElementById("setupForm")),
        tmdbKey: /** @type {HTMLInputElement} */ (document.getElementById("tmdbKey")),
        accountNames: /** @type {HTMLTextAreaElement} */ (document.getElementById("accountNames")),
        setupStatus: /** @type {HTMLDivElement} */ (document.getElementById("setupStatus")),
        loadBtn: /** @type {HTMLButtonElement} */ (document.getElementById("loadBtn")),
        counts: /** @type {HTMLSpanElement} */ (document.getElementById("counts")),
        textFeed: /** @type {HTMLDivElement} */ (document.getElementById("textFeed")),
      };

      function escapeText(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function clampInt(n, min, max) {
        const x = Number.isFinite(n) ? n : min;
        return Math.max(min, Math.min(max, Math.trunc(x)));
      }

      function formatRelative(date) {
        const d = date instanceof Date ? date : new Date(date);
        const seconds = Math.max(0, Math.round((Date.now() - d.getTime()) / 1000));
        if (seconds < 60) return `${seconds}s ago`;
        const minutes = Math.round(seconds / 60);
        if (minutes < 60) return `${minutes}m ago`;
        const hours = Math.round(minutes / 60);
        if (hours < 24) return `${hours}h ago`;
        const days = Math.round(hours / 24);
        return `${days}d ago`;
      }

      function picsum(seed, w, h) {
        // Static-ish, cacheable placeholders. Using a public placeholder source keeps the repo lightweight.
        const width = clampInt(w, 200, 2000);
        const height = clampInt(h, 200, 2000);
        return `https://picsum.photos/seed/${encodeURIComponent(seed)}/${width}/${height}`;
      }

      /** @typedef {{ id:string, name:string, handle:string, avatarSeed:string, hasPersonality:boolean }} User */
      /** @typedef {{ id:string, kind:"text", userId:string, createdAt:number, text:string, likes:number, comments:number, reposts:number }} Post */

      const LS_KEY = "parasocialNetwork.v1";

      function loadPrefs() {
        try {
          const raw = localStorage.getItem(LS_KEY);
          if (!raw) return { tmdbKey: "", namesText: "" };
          const parsed = JSON.parse(raw);
          return {
            tmdbKey: typeof parsed.tmdbKey === "string" ? parsed.tmdbKey : "",
            namesText: typeof parsed.namesText === "string" ? parsed.namesText : "",
          };
        } catch {
          return { tmdbKey: "", namesText: "" };
        }
      }

      function savePrefs(prefs) {
        try {
          localStorage.setItem(LS_KEY, JSON.stringify(prefs));
        } catch {
          // ignore
        }
      }

      const defaultUsers = /** @type {User[]} */ ([
        { id: "u1", name: "Kai Rivera", handle: "@kai", avatarSeed: "avatar-kai", hasPersonality: true },
        { id: "u2", name: "Mina Patel", handle: "@minap", avatarSeed: "avatar-mina", hasPersonality: true },
        { id: "u3", name: "Jules Nguyen", handle: "@julesn", avatarSeed: "avatar-jules", hasPersonality: true },
        { id: "u4", name: "Sam Okafor", handle: "@samok", avatarSeed: "avatar-sam", hasPersonality: true },
        { id: "u5", name: "Avery Chen", handle: "@avery", avatarSeed: "avatar-avery", hasPersonality: true },
        { id: "u6", name: "Rae Thompson", handle: "@raet", avatarSeed: "avatar-rae", hasPersonality: true },
      ]);

      /** @type {User[]} */
      let users = [...defaultUsers];

      const placeholderTexts = [
        "Placeholder post: I swear I’ve had the same song on repeat for three days.",
        "Placeholder post: Tiny wins count. Today’s tiny win: I drank water before coffee.",
        "Placeholder post: If you ever feel behind, remember everyone else is also guessing.",
        "Placeholder post: I’m in my ‘make it simpler’ era.",
        "Placeholder post: Tried a new recipe. It was… edible. We’re calling that progress.",
        "Placeholder post: A reminder that you can change your mind and it’s still a decision.",
        "Placeholder post: My to-do list is just a list of things I’m avoiding.",
        "Placeholder post: The weather is doing plot twists again.",
        "Placeholder post: I miss the version of the internet that felt smaller.",
        "Placeholder post: If this is your sign, consider it delivered.",
        "Placeholder post: I’m collecting little moments like they’re souvenirs.",
        "Placeholder post: Today I’m choosing ‘good enough’ on purpose.",
        "Placeholder post: The nicest thing you can do is be easy to be around.",
        "Placeholder post: Brb romanticizing an ordinary afternoon.",
        "Placeholder post: I don’t need new habits, I need fewer tabs.",
        "Placeholder post: Reminder: you’re allowed to rest without earning it.",
        "Placeholder post: Hot take: the best plans include snacks.",
        "Placeholder post: This should become real copy later—right now it’s just layout fuel.",
      ];

      /** @type {Post[]} */
      let posts = [];

      /** @type {Map<string, User>} */
      let userById = new Map();

      function rebuildUsersIndex() {
        userById = new Map(users.map((u) => [u.id, u]));
      }

      function rebuildPosts() {
        const now = Date.now();
        /** @type {Post[]} */
        const out = [];
        const safeUsers = users.length ? users : [...defaultUsers];
        for (let i = 0; i < placeholderTexts.length; i++) {
          const user = safeUsers[i % safeUsers.length];
          const id = `p-text-${i + 1}`;
          out.push({
            id,
            kind: "text",
            userId: user.id,
            createdAt: now - (i * 37 + 9) * 60 * 1000,
            text: placeholderTexts[i],
            likes: 20 + ((i * 17) % 400),
            comments: 1 + ((i * 7) % 38),
            reposts: (i * 3) % 19,
          });
        }
        posts = out;
      }

      function avatarUrl(seed) {
        return picsum(seed, 96, 96);
      }

      function statsHtml(p) {
        return `
          <span aria-label="Likes">❤ ${p.likes.toLocaleString()}</span>
          <span aria-label="Comments">💬 ${p.comments.toLocaleString()}</span>
          <span aria-label="Reposts">↻ ${p.reposts.toLocaleString()}</span>
        `;
      }

      function renderTextPost(p) {
        const u = userById.get(p.userId);
        if (!u) return "";
        const created = new Date(p.createdAt);
        const noPersonality = !u.hasPersonality;
        return `
          <article class="post" data-kind="text" data-id="${escapeText(p.id)}">
            <div class="post-head">
              <div class="who">
                <div class="avatar"><img src="${escapeText(avatarUrl(u.avatarSeed))}" alt="" loading="lazy" /></div>
                <div style="min-width: 0">
                  <div class="name">${escapeText(u.name)}</div>
                  <div class="handle">
                    ${escapeText(u.handle)}
                    ${noPersonality ? `<span class="pill" title="TMDB lookup returned no results">no personality</span>` : ""}
                  </div>
                </div>
              </div>
              <div class="timestamp" title="${escapeText(created.toISOString())}">${escapeText(formatRelative(created))}</div>
            </div>
            <div class="post-body">
              <p>${escapeText(p.text)}</p>
              <div class="stats">${statsHtml(p)}</div>
            </div>
          </article>
        `;
      }

      function setStatus(msg) {
        el.setupStatus.textContent = msg || "";
      }

      function parseAccountNames(text) {
        const raw = String(text || "")
          .split(/\r?\n/g)
          .map((s) => s.trim())
          .filter(Boolean);
        // de-dupe but keep order
        const seen = new Set();
        /** @type {string[]} */
        const out = [];
        for (const n of raw) {
          const key = n.toLowerCase();
          if (seen.has(key)) continue;
          seen.add(key);
          out.push(n);
        }
        return out;
      }

      function handleFromName(name) {
        const s = String(name || "")
          .toLowerCase()
          .normalize("NFKD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9]+/g, "")
          .slice(0, 18);
        return `@${s || "user"}`;
      }

      function uniquifyHandles(list) {
        /** @type {Record<string, number>} */
        const counts = {};
        return list.map((h) => {
          const base = h;
          const n = (counts[base] ?? 0) + 1;
          counts[base] = n;
          return n === 1 ? base : `${base}${n}`;
        });
      }

      async function tmdbSearchPerson(apiKey, query) {
        const url = new URL("https://api.themoviedb.org/3/search/person");
        url.searchParams.set("api_key", apiKey);
        url.searchParams.set("query", query);
        url.searchParams.set("include_adult", "false");
        url.searchParams.set("page", "1");
        const res = await fetch(url.toString(), { method: "GET", mode: "cors" });
        if (!res.ok) throw new Error(`TMDB error ${res.status}`);
        return await res.json();
      }

      async function buildUsersFromNames(apiKey, names) {
        if (!names.length) return [...defaultUsers];

        /** @type {{ name:string, hasPersonality:boolean, tmdbId?:number, popularity?:number }[]} */
        const resolved = [];

        for (const inputName of names) {
          if (!apiKey) {
            resolved.push({ name: inputName, hasPersonality: false });
            continue;
          }
          try {
            const data = await tmdbSearchPerson(apiKey, inputName);
            const results = Array.isArray(data?.results) ? data.results : [];
            if (!results.length) {
              resolved.push({ name: inputName, hasPersonality: false });
              continue;
            }
            let best = results[0];
            for (const r of results) {
              if ((r?.popularity ?? -1) > (best?.popularity ?? -1)) best = r;
            }
            const bestName = typeof best?.name === "string" && best.name.trim() ? best.name.trim() : inputName;
            resolved.push({
              name: bestName,
              hasPersonality: true,
              tmdbId: typeof best?.id === "number" ? best.id : undefined,
              popularity: typeof best?.popularity === "number" ? best.popularity : undefined,
            });
          } catch {
            resolved.push({ name: inputName, hasPersonality: false });
          }
        }

        const handles = uniquifyHandles(resolved.map((r) => handleFromName(r.name)));

        /** @type {User[]} */
        const out = resolved.map((r, i) => {
          const seed = r.hasPersonality
            ? `tmdb-${r.tmdbId ?? r.name}`
            : `no-personality-${r.name}`;
          return {
            id: `u${i + 1}`,
            name: r.name,
            handle: handles[i],
            avatarSeed: seed,
            hasPersonality: r.hasPersonality,
          };
        });

        return out.length ? out : [...defaultUsers];
      }

      function render() {
        const noPersonalityCount = users.reduce((n, u) => n + (u.hasPersonality ? 0 : 1), 0);
        el.counts.textContent = `${posts.length} posts • ${users.length} accounts${
          noPersonalityCount ? ` • ${noPersonalityCount} no personality` : ""
        }`;
        el.textFeed.innerHTML = posts.map(renderTextPost).join("");
      }

      function applyState() {
        rebuildUsersIndex();
        rebuildPosts();
        render();
      }

      // Initial render.
      applyState();

      // Restore saved inputs (optional).
      const prefs = loadPrefs();
      if (prefs.tmdbKey) el.tmdbKey.value = prefs.tmdbKey;
      if (prefs.namesText) el.accountNames.value = prefs.namesText;

      el.setupForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const apiKey = el.tmdbKey.value.trim();
        const namesText = el.accountNames.value;
        const names = parseAccountNames(namesText);
        savePrefs({ tmdbKey: apiKey, namesText });

        el.loadBtn.disabled = true;
        setStatus(names.length ? "Looking up names on TMDB…" : "Using default accounts…");
        try {
          users = await buildUsersFromNames(apiKey, names);
          applyState();
          const missing = users.reduce((n, u) => n + (u.hasPersonality ? 0 : 1), 0);
          setStatus(
            names.length
              ? `Loaded ${users.length} accounts (${missing ? `${missing} no personality` : "all have personality"}).`
              : `Loaded ${users.length} default accounts.`
          );
        } finally {
          el.loadBtn.disabled = false;
        }
      });

      // Optional: deep-link to a post via ?post=p-text-3
      const params = new URLSearchParams(location.search);
      const deepId = params.get("post");
      if (deepId) {
        const target = el.textFeed.querySelector(`[data-id="${CSS.escape(deepId)}"]`);
        if (target instanceof HTMLElement) {
          if (!target.hasAttribute("tabindex")) target.tabIndex = -1;
          target.scrollIntoView({ block: "start", behavior: "smooth" });
          target.focus();
        }
      }
    </script>
  </body>
</html>
